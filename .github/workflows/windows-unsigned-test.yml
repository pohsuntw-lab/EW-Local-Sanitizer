name: Windows unsigned test smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/plaintext-hardening-v0.1
    paths:
      - .github/workflows/windows-unsigned-test.yml
      - electron-builder.yml
      - package.json
      - package-lock.json
      - scripts/**
      - src/**
      - schemas/**
      - tests/**

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NO_UPDATE_NOTIFIER: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --omit=optional
      - name: Validate source and dependencies
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run synthetic tests
        run: npm test
      - name: Build unsigned Windows artifacts
        run: npm run package:win
      - name: Smoke portable, installer and uninstaller
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
